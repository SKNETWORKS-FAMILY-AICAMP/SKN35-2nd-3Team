[project]
name = "project-2nd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "certifi>=2026.7.22",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "folium>=0.20.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.3.0",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "optuna>=4.9.0",
    "pandas>=3.0.5",
    "plotly>=6.9.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "sqlalchemy>=2.0.52",
    "streamlit>=1.62.0",
    "streamlit-folium>=0.27.4",
    "torch>=2.4",
    "torchaudio>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.70.0",
    "uvicorn>=0.52.4",
    "xgboost>=3.4.1",
]

[project.scripts]
project-2nd = "project_2nd:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# torch/torchvision/torchaudio를 CPU 전용 wheel로 고정 (GPU/CUDA 유무와 무관하게 팀원 전원 동일 빌드 설치)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
